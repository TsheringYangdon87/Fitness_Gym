<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Online Fitness Gym - Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/notification.css">
</head>
<body>
    <!-- Menu Button (Hamburger) -->
    <button class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-section">
            <img src="../PHOTOS/LOGO.png" alt="logo" class="logo-icon">
            <div class="logo-text">
                <h2>JNEC Fitness</h2>
                <p>Online Gym</p>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link" data-page="dashboard">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="membership.html" class="nav-link" data-page="membership">
                    <i class="fas fa-id-card"></i>
                    <span>My Membership</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="equipment.html" class="nav-link" data-page="equipment">
                    <i class="fas fa-dumbbell"></i>
                    <span>Equipment</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="myschedule.html" class="nav-link" data-page="schedule">
                    <i class="far fa-calendar-alt"></i>
                    <span>My Schedule</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="feedback.html" class="nav-link" data-page="feedback">
                    <i class="far fa-comment"></i>
                    <span>Feedback</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="setting.html" class="nav-link" data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Top Bar -->
    <header class="topbar">
        <div class="page-title">
            <h1 id="page-title">Notifications</h1>
        </div>
        <div class="topbar-actions">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-notifications" placeholder="Search notifications...">
            </div>
            <button class="icon-button" id="notification-btn">
                <i class="far fa-bell"></i>
                <span class="notification-badge"></span>
            </button>
            <div class="user-profile" id="user-profile">
                <div class="user-avatar">TD</div>
                <span class="user-name">Tshewang Dorji</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Notification Header Actions -->
        <div class="notification-header">
            <div class="notification-tabs">
                <button class="tab-btn active" data-filter="all">
                    All <span class="tab-count" id="all-count">0</span>
                </button>
                <button class="tab-btn" data-filter="unread">
                    Unread <span class="tab-count" id="unread-count">0</span>
                </button>
                <button class="tab-btn" data-filter="announcements">
                    Announcements <span class="tab-count" id="announcements-count">0</span>
                </button>
                <button class="tab-btn" data-filter="reminders">
                    Reminders <span class="tab-count" id="reminders-count">0</span>
                </button>
            </div>
            <div class="notification-actions">
                <button class="action-btn-small" id="mark-all-read">
                    <i class="fas fa-check-double"></i>
                    Mark all as read
                </button>
                <button class="action-btn-small secondary" id="clear-all">
                    <i class="fas fa-trash-alt"></i>
                    Clear all
                </button>
            </div>
        </div>

        <!-- Notifications List -->
        <div class="notifications-container">
            <div class="notifications-list" id="notifications-list">
                <!-- Notifications will be loaded here by JavaScript -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <i class="far fa-bell-slash"></i>
                <h3>No notifications</h3>
                <p>You're all caught up! Check back later for new updates.</p>
            </div>
        </div>
    </main>

    <script src="../JS/notification.js"></script>
</body>
</html>
