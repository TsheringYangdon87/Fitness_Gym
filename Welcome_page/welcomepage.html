<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Online Fitness Gym</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/welcomepage.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header">
        <div class="header-content">
            <div class="logo-left">
                <img src="../PHOTOS/RUB.png" alt="RUB Logo">
            </div>
            <div class="logo-right">
                <img src="../PHOTOS/JNEC LOGO.png" alt="JNEC Logo">
            </div>
        </div>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="content-wrapper">
                <!-- Left Side Content -->
                <div class="text-content">
                    <div class="welcome-badge">
                        <span>Welcome To</span>
                    </div>
                    <h1 class="main-heading">
                        JNEC Online <br>
                        <span class="highlight">Fitness Gym</span>
                    </h1>
                    <p class="subtitle">
                        Transform your body, elevate your mind, and achieve your fitness goals 
                        with our comprehensive online training programs and expert guidance.
                    </p>
                    <div class="cta-buttons">
                        <a href="../HTML/loginpage.html" class="btn btn-primary">
                            Get Started
                            <i class="fas fa-arrow-right"></i>
                        </a>
                        <a href="#about" class="btn btn-secondary">
                            Learn More
                        </a>
                    </div>
                </div>

                <!-- Right Side - Logo Display -->
                <div class="logo-display">
                    <div class="logo-circle">
                        <img src="../PHOTOS/LOGO.png" alt="JNEC Fitness Logo" class="main-logo">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../JS/welcomepage.js"></script>
</body>
</html>
