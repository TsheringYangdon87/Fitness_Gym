<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created Successfully</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/accountsuccess.css">
</head>
<body>
    <div class="container-fluid app-container">
        <div class="row header-row align-items-center">
            <div class="col-2 text-start">
                <!-- Empty space for symmetry -->
            </div>
            <div class="col-8 text-center">
               
            </div>
            <div class="col-2 text-end">
                <img src="../PHOTOS/LOGO.png" alt="Company Logo" class="img-fluid logo">
            </div>
        </div>
        <div class="success-container">
            <div class="row content-row justify-content-center">
                <div class="col-12 success-column">
                    <div class="success-content text-center">
                        <div class="success-icon-container mb-4">
                            <div class="success-icon">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>

                        <p class="success-message mb-4">Your account has been created</p>
                        <div class="d-grid">
                            <a href="../HTML/loginpage.html" class="btn continue-btn">Continue</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../JS/accountsuccess.js"></script>
