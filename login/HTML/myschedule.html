<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule - JNEC Online Fitness Gym</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/myschedule.css">
</head>
<body>
    <!-- Menu Toggle for Mobile -->
    <button class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
    </button>
    
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <img src="../PHOTOS/LOGO.png" alt="logo" class="logo-icon">
            <div class="logo-text">
                <h2>JNEC Fitness</h2>
                <p>Online Gym</p>
            </div>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="Dashboard.html" class="nav-link">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="membership.html" class="nav-link">
                    <i class="fas fa-credit-card"></i>
                    <span>My Membership</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="equipment.html" class="nav-link">
                    <i class="fas fa-dumbbell"></i>
                    <span>Equipment</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="schedule.html" class="nav-link active">
                    <i class="far fa-calendar-alt"></i>
                    <span>My Schedule</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="feedback.html" class="nav-link">
                    <i class="far fa-comment"></i>
                    <span>Feedback</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="setting.html" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="header">
            <h1 class="page-title">My Schedule</h1>
            
            <div class="header-right">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search equipment, workouts...">
                </div>
                
                <div class="header-icons">
                    <a href="notification.html" class="icon-btn">
                        <i class="far fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </a>
                </div>
                
                <div class="user-profile">
                    <div class="user-avatar">TY</div>
                    <div class="user-info">
                        <span class="user-name">Tshering Yangdon</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="content">
            <!-- Header with New Schedule Button -->
            <div class="content-header">
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all">
                        <i class="fas fa-list"></i>
                        All
                    </button>
                    <button class="tab-btn" data-filter="upcoming">
                        <i class="fas fa-clock"></i>
                        Upcoming
                    </button>
                    <button class="tab-btn" data-filter="today">
                        <i class="fas fa-calendar-day"></i>
                        Today
                    </button>
                    <button class="tab-btn" data-filter="completed">
                        <i class="fas fa-check-circle"></i>
                        Completed
                    </button>
                    <button class="tab-btn" data-filter="cancelled">
                        <i class="fas fa-times-circle"></i>
                        Cancelled
                    </button>
                </div>
                
                <button class="new-schedule-btn" onclick="openBookingModal()">
                    <i class="fas fa-plus"></i>
                    New Schedule
                </button>
            </div>

            <!-- Schedule List -->
            <div class="schedule-list" id="scheduleContainer">
                <!-- Schedule items will be loaded here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">
                    <i class="fas fa-calendar-times"></i>
                </div>
                <h3>No Sessions Found</h3>
                <p>You don't have any scheduled sessions yet. Book your workout now!</p>
                <button class="book-now-btn" onclick="openBookingModal()">
                    <i class="fas fa-plus"></i>
                    Book a Session
                </button>
            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div class="booking-modal" id="bookingModal">
        <div class="modal-overlay" onclick="closeBookingModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Book a Session</h3>
                <button class="modal-close" onclick="closeBookingModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-dumbbell"></i>
                            Select Equipment
                        </label>
                        <select class="form-select" id="equipment" required>
                            <option value="">Choose equipment...</option>
                            <option value="Treadmill">Treadmill</option>
                            <option value="Bench Press">Bench Press</option>
                            <option value="Leg Press">Leg Press Machine</option>
                            <option value="Dumbbells">Dumbbells</option>
                            <option value="Smith Machine">Smith Machine</option>
                            <option value="Cable Machine">Cable Machine</option>
                            <option value="Rowing Machine">Rowing Machine</option>
                            <option value="Pulldown Machine">Pulldown Machine</option>
                            <option value="Punching Bag">Punching Bag</option>
                            <option value="Kettlebells">Kettlebells</option>
                            <option value="Barbells">Barbells</option>
                            <option value="Abdominal Bench">Abdominal Bench</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-calendar-alt"></i>
                            Select Date
                        </label>
                        <input type="date" class="form-input" id="date" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-clock"></i>
                            Select Time
                        </label>
                        <select class="form-select" id="time" required>
                            <option value="">Choose time...</option>
                            <option value="06:00 AM">06:00 AM</option>
                            <option value="07:00 AM">07:00 AM</option>
                            <option value="08:00 AM">08:00 AM</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                            <option value="06:00 PM">06:00 PM</option>
                            <option value="07:00 PM">07:00 PM</option>
                            <option value="08:00 PM">08:00 PM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-stopwatch"></i>
                            Duration (minutes)
                        </label>
                        <select class="form-select" id="duration" required>
                            <option value="30">30 minutes</option>
                            <option value="45">45 minutes</option>
                            <option value="60" selected>60 minutes</option>
                            <option value="90">90 minutes</option>
                            <option value="120">120 minutes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-sticky-note"></i>
                            Notes (Optional)
                        </label>
                        <textarea class="form-textarea" id="notes" rows="3" placeholder="Add any special requirements..."></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeBookingModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmBooking()">Book Session</button>
            </div>
        </div>
    </div>

    <script src="../JS/myschedule.js"></script>
</body>
</html>
