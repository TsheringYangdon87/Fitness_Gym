<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - JNEC Fitness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/profileEdit.css">
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-header">
            <img src="../PHOTOS/LOGO.png" alt="JNEC Logo" class="logo-icon">
            <div class="logo-text">
                <h3>JNEC Fitness</h3>
                <p>Online Gym</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="membership.html" class="nav-item">
                <i class="fas fa-id-card"></i>
                <span>My Membership</span>
            </a>
            <a href="equipment.html" class="nav-item">
                <i class="fas fa-dumbbell"></i>
                <span>Equipment</span>
            </a>
            <a href="myschedule.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i>
                <span>My Schedule</span>
            </a>
            <a href="feedback.html" class="nav-item">
                <i class="fas fa-comment-dots"></i>
                <span>Feedback</span>
            </a>
            <a href="setting.html" class="nav-item active">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="back-button" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h1>Edit Profile</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <a href="notification.html" class="notification-icon">
                    <i class="far fa-bell"></i>
                    <span class="notification-badge">1</span>
                </a>
                <div class="user-profile">
                    <div class="user-avatar">TD</div>
                    <span>Tshewang Dorji</span>
                </div>
            </div>
        </header>

        <div class="edit-profile-container">
            <div class="profile-card">
                <!-- Profile Header with Avatar Upload -->
                <div class="profile-header">
                    <div class="avatar-upload-section">
                        <div class="avatar-preview" id="avatarPreview">
                            <img src="" alt="Profile Picture" id="avatarImage" style="display: none;">
                            <div class="avatar-placeholder" id="avatarPlaceholder">JD</div>
                        </div>
                        <div class="avatar-upload-info">
                            <h3>Profile Picture</h3>
                            <p>Upload a profile picture (Max 5MB)</p>
                            <div class="avatar-buttons">
                                <label for="avatarInput" class="btn-upload">
                                    <i class="fas fa-camera"></i>
                                    Upload Photo
                                </label>
                                <button class="btn-remove" id="removeAvatar" style="display: none;">
                                    <i class="fas fa-trash"></i>
                                    Remove
                                </button>
                            </div>
                            <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        </div>
                    </div>
                </div>

                <!-- Edit Profile Form -->
                <form class="edit-profile-form" id="editProfileForm">
                    <div class="form-section">
                        <h2 class="section-title">
                            <i class="fas fa-user"></i>
                            Personal Information
                        </h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Full Name <span class="required">*</span></label>
                                <input type="text" id="fullName" placeholder="Enter your full name" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email <span class="required">*</span></label>
                                <input type="email" id="email" placeholder="Enter your email" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="phoneNumber">Phone Number <span class="required">*</span></label>
                                <div class="phone-input">
                                    <span class="phone-code">+975</span>
                                    <input type="tel" id="phoneNumber" placeholder="Your phone number" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="gender">Gender <span class="required">*</span></label>
                                <div class="custom-select">
                                    <select id="gender" required>
                                        <option value="" disabled selected>Select Gender</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="section-title">
                            <i class="fas fa-graduation-cap"></i>
                            Academic Information
                        </h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="userType">User Type <span class="required">*</span></label>
                                <div class="custom-select">
                                    <select id="userType" required>
                                        <option value="" disabled selected>Select User Type</option>
                                        <option value="student">Student</option>
                                        <option value="staff">Staff</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>

                            <!-- Dynamic field based on user type -->
                            <div class="form-group" id="dynamicFieldGroup">
                                <label for="dynamicField"><span id="dynamicFieldLabel">Year</span> <span class="required">*</span></label>
                                <div class="custom-select">
                                    <select id="dynamicField" required>
                                        <option value="" disabled selected>Select Year</option>
                                        <option value="1st-year">1st Year</option>
                                        <option value="2nd-year">2nd Year</option>
                                        <option value="3rd-year">3rd Year</option>
                                        <option value="4th-year">4th Year</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width" id="courseFieldGroup">
                                <label for="course">Course <span class="required">*</span></label>
                                <div class="custom-select">
                                    <select id="course" required>
                                        <option value="" selected disabled>Select Course</option>
                                        <option value="csn">Computer System and Network</option>
                                        <option value="c">Civil</option>
                                        <option value="ma">Multi-Media and Animation</option>
                                        <option value="cs">Construction and Supervision</option>
                                        <option value="e">Electrical</option>
                                        <option value="ece">Electronic and Communication Engineering</option>
                                        <option value="m">Mechanical</option>
                                        <option value="mpm">Materials and Procurement Management</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>

                            <div class="form-group full-width" id="departmentFieldGroup" style="display: none;">
                                <label for="department">Department <span class="required">*</span></label>
                                <div class="custom-select">
                                    <select id="department">
                                        <option value="" selected disabled>Select Department</option>
                                        <option value="academic">Academic Affairs</option>
                                        <option value="administration">Administration</option>
                                        <option value="finance">Finance</option>
                                        <option value="hr">Human Resources</option>
                                        <option value="it">Information Technology</option>
                                        <option value="library">Library</option>
                                        <option value="maintenance">Maintenance</option>
                                        <option value="student-affairs">Student Affairs</option>
                                        <option value="other">Other</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="section-title">
                            <i class="fas fa-dumbbell"></i>
                            Fitness Goals (Optional)
                        </h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fitnessGoal">Primary Fitness Goal</label>
                                <div class="custom-select">
                                    <select id="fitnessGoal">
                                        <option value="" selected>Select Goal</option>
                                        <option value="weight-loss">Weight Loss</option>
                                        <option value="muscle-gain">Muscle Gain</option>
                                        <option value="strength">Build Strength</option>
                                        <option value="endurance">Improve Endurance</option>
                                        <option value="flexibility">Increase Flexibility</option>
                                        <option value="general-fitness">General Fitness</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="experienceLevel">Experience Level</label>
                                <div class="custom-select">
                                    <select id="experienceLevel">
                                        <option value="" selected>Select Level</option>
                                        <option value="beginner">Beginner</option>
                                        <option value="intermediate">Intermediate</option>
                                        <option value="advanced">Advanced</option>
                                    </select>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="window.history.back()">
                            <i class="fas fa-times"></i>
                            Cancel
                        </button>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i>
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../JS/profileEdit.js"></script>
</body>
</html>
